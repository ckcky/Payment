spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
  application:
    name: catalog-service
  datasource:
    url: jdbc:mysql://localhost:3306/catalog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      # Redis 用作 SKU 读缓存（cache-aside）与秒杀配额预扣（Lua 原子），非数据源、fail-open。
      timeout: 1000ms
      lettuce:
        # 连接池（ADR-0060）：默认单连接多路复用，秒杀 Lua 高并发下串行排队
        # （2026-09-04 实测 500 VU p95 528ms → 池化后大幅下降）。需 commons-pool2 依赖。
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# SKU 读缓存（014，cache-aside）：命中 Redis 则跳过 DB；写入/状态流转时失效。Redis 不可用时 fail-open 直连 DB。
catalog:
  cache:
    # 对照实验已完成（2026-09-04，实测见 performance README §4.6）：关闭时 DB 查询 +10.4 万次/2min
    # vs 开启 +23 次；p95 10.8→6.8ms。生产必须保持开启。
    enabled: true
    ttl-seconds: 300
    key-prefix: "sku:"
  # 秒杀配额预扣（014，Redis Lua 原子）：只有 seed 过的 SKU 才走秒杀快速准入；未播种视为普通 SKU 直接放行。
  seckill:
    enabled: true
