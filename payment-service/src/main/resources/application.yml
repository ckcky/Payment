spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    openfeign:
      client:
        config:
          default:
            # 出站 RPC 超时：connect/read 各 1s（ADR-0012 超时口径，全服务统一）
            connect-timeout: 1000
            read-timeout: 1000
      # 熔断：为所有 Feign 客户端包裹 circuit breaker（依赖 spring-cloud-starter-circuitbreaker-resilience4j）
      circuitbreaker:
        enabled: true

server:
  port: 8084

# 平台级安全底座（Feature 009 / ADR-0034）：出站内部服务令牌
# 开关打开且注入 PLATFORM_INTERNAL_TOKEN 后，出站 RPC 才会对 /internal/** 端点附加 X-Service-Token；
# 对外/渠道 URL 一律不附加，避免内网共享密钥外泄。默认关闭以保持本地联调零改动。
platform:
  security:
    internal-token: ${PLATFORM_INTERNAL_TOKEN:}
    outbound-token-enabled: false

# 出站调用参数
payment:
  channel:
    # 对外（渠道 / 外部系统）HTTP 调用超时预算：1.5s（ADR-0012 超时口径，全服务统一）
    http-timeout-ms: 1500
  # 出站 RPC 弹性参数（仅对幂等 sink 调用生效）
  fulfillment:
    retry:
      max-attempts: 3
      backoff-ms: 200
  resolve:
    # /payments/{id}/resolve 收敛端点鉴权开关；启用但未配置 token 时返回 503 拒绝
    auth-enabled: true
    admin-token: ${PAYMENT_ADMIN_TOKEN:}
  # 安全底座（Feature 009 / ADR-0024~0026）
  # 所有密钥一律经环境变量注入，禁止硬编码与明文日志。
  security:
    # 内部服务间调用共享令牌（env PAYMENT_INTERNAL_TOKEN）
    service-token: ${PAYMENT_INTERNAL_TOKEN:}
    # 内部端点鉴权开关：默认 false（本地联调放行），生产 MUST 置 true
    internal-auth-enabled: false
    # 渠道回调 HMAC-SHA256 验签密钥（env PAYMENT_CHANNEL_SECRET）
    channel-secret: ${PAYMENT_CHANNEL_SECRET:}
    # 回调防重放窗口（毫秒），默认 5min；超出窗口的合法签名同样拒绝
    signature-replay-window-ms: 300000
  # 最小风控占位（ADR-0028）：默认放行，命中仅记指标+审计，绝不阻断资金主流程
  risk:
    enabled: false
    single-max-amount-minor: 0          # 0 表示不设单笔上限
    window-limit-count: 0               # 0 表示不做频率限制
  # 支付可靠性（Feature 003 / ADR-0003~0005、ADR-0012~0015）
  reliability:
    timeout: 30s                       # PROCESSING 超此阈值且无明确结果 → UNKNOWN（ADR-0004）
    timeout-scan-interval-ms: 10000    # 超时扫描调度间隔（ADR-0004）
    retry-max-attempts: 3              # 渠道调用上限（含首次，ADR-0005）
    retry-backoff: 1s,2s,4s            # 第 n 次重试的退避（越界取最后一项）；不落库，请求内联等待
    query-max-attempts: 5              # UNKNOWN 主动查询尝试上限，达此停止自动查询（ADR-0003）
    query-interval-ms: 15000           # UNKNOWN 主动查询调度间隔（ADR-0003）

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
