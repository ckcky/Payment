spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
    openfeign:
      client:
        config:
          default:
            # 出站 RPC 超时：connect/read 各 1s（ADR-0012 超时口径，全服务统一）
            connect-timeout: 1000
            read-timeout: 1000
      # 熔断：为所有 Feign 客户端包裹 circuit breaker（依赖 spring-cloud-starter-circuitbreaker-resilience4j）
      circuitbreaker:
        enabled: true

  lifecycle:
    # 优雅停机排水上限：SIGTERM 后在途请求最多等 30s（spec 023 / M5）
    timeout-per-shutdown-phase: 30s

server:
  port: 8084
  # 优雅停机：等在途请求完成再关闭（spec 023 / M5）
  shutdown: graceful

# 出站调用参数
payment:
  channel:
    # 对外（渠道 / 外部系统）HTTP 调用超时预算：1.5s（ADR-0012 超时口径，全服务统一）
    http-timeout-ms: 1500
    # 全局默认场景（FR-014：语义不变；per-channel 可覆盖，见下 adapters）
    mock-scenario: ${PAYMENT_MOCK_SCENARIO:SUCCESS}
    # 退款「受理 + 异步推送」模式（spec 019 / D7）
    refund-async: ${PAYMENT_CHANNEL_REFUND_ASYNC:true}
    refund-async-delay-ms: 1000
    # per-channel 场景覆盖（Feature 028 / FR-014、FR-010）：未配回落全局 mock-scenario。
    # 场景名必须严格等于枚举名（SUCCESS / FAILURE / TIMEOUT / TRANSPORT_ERROR / BUSINESS_UNKNOWN），
    # 坏值在 Bean 创建期 FAIL FAST（ADR-0049 第 2 条）。
    adapters:
      ALIPAY: { scenario: ${PAYMENT_CHANNEL_ALIPAY_SCENARIO:SUCCESS} }
      WECHAT: { scenario: ${PAYMENT_CHANNEL_WECHAT_SCENARIO:SUCCESS} }
      DOUYIN: { scenario: ${PAYMENT_CHANNEL_DOUYIN_SCENARIO:SUCCESS} }
  # 支付渠道路由（Feature 028 / ADR-0073 / FR-031）
  routing:
    # false = 回落旧行为（channelCode 必填，不选路）；灰度开关，可一键退回今天的行为（FR-020①/FR-033）
    enabled: ${PAYMENT_ROUTING_ENABLED:true}
    # enabled=true 且 priority 最小者被自动选中；同优先级按 channelCode 字典序（INV-3 确定性）
    channels:
      ALIPAY: { enabled: true,  priority: 10 }
      WECHAT: { enabled: true,  priority: 20 }
      DOUYIN: { enabled: false, priority: 30 }
      MOCK:   { enabled: true,  priority: 90 }
    # per-channel 可用性（Feature 028 / FR-034、FR-035）：**静态配置桩**，不做真实探测。
    # UP = 正常；DEGRADED = 保留候选但排序降级；DOWN = 排除出候选集（显式指定则 409 CHANNEL_UNAVAILABLE）。
    # 留空 = 全部按 UP 处理；演示期可用 POST /internal/channels/{code}/status 覆盖（仅 demo profile）。
    # 注意：不复用 Resilience4j CircuitBreaker 状态（D6 / S11）。
    availability: {}
  # 出站 RPC 弹性参数（仅对幂等 sink 调用生效）
  fulfillment:
    retry:
      max-attempts: 3
      backoff-ms: 200
  resolve:
    # /payments/{id}/resolve 收敛端点鉴权开关；启用但未配置 token 时返回 503 拒绝
    auth-enabled: true
    admin-token: ${PAYMENT_ADMIN_TOKEN:}
  # Mock 收银台（ADR-0048 修订版）：enabled=true 时 createPayment 跳过渠道内联调用，
  # Payment 停留 PROCESSING 等收银台回调，响应附 payUrl。默认 true（演示优先：任何方式
  # 手动起 payment-service 都能拿到收银台，不再依赖启动时带环境变量）；e2e / CI 等
  # 自动化场景依赖内联同步 charge 路径，必须显式设 PAYMENT_MOCK_CASHIER_ENABLED=false
  # （run-e2e-*.sh 与 .github/workflows/e2e.yml 已显式声明）。
  mock-cashier:
    enabled: ${PAYMENT_MOCK_CASHIER_ENABLED:true}
    # 收银台基地址：**必须填「客户端可达」地址**，不是服务端调用目标。
    # 该值被拼进 payUrl 交给前端 window.open()，由浏览器解析——口径是「宿主能否打开」。
    # ✗ mock-channel-web:8091（容器内服务名，宿主 NXDOMAIN）
    # ✗ host.docker.internal:8091（该名仅容器内可解析，宿主同样 NXDOMAIN）
    # ✓ localhost:8091（8091 已 publish 到宿主）
    base-url: ${PAYMENT_MOCK_CASHIER_BASE_URL:http://localhost:8091}
  # 渠道回调验签（ADR-0025：本期为空实现（占位），回调一律放行；接入真实渠道时再实现 verifySignature）
  # 支付可靠性（Feature 003 / ADR-0003~0005、ADR-0012~0015）
  reliability:
    timeout: 30s                       # PROCESSING 超此阈值且无明确结果 → UNKNOWN（ADR-0004）
    timeout-scan-interval-ms: 10000    # 超时扫描调度间隔（ADR-0004）
    retry-max-attempts: 3              # 渠道调用上限（含首次，ADR-0005）
    retry-backoff: 1s,2s,4s            # 第 n 次重试的退避（越界取最后一项）；不落库，请求内联等待
    query-max-attempts: 5              # UNKNOWN 主动查询尝试上限，达此停止自动查询（ADR-0003）
    query-interval-ms: 15000           # UNKNOWN 主动查询调度间隔（ADR-0003）

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # P99 面板依赖 http_server_requests_seconds_bucket
        http.client.requests: true  # RPC 面板依赖 http_client_requests_seconds_bucket（Feign）
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
