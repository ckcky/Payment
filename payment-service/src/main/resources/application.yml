spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    openfeign:
      client:
        config:
          default:
            # 全链路超时（修复：原无超时，下游挂起将耗尽连接池）
            connect-timeout: 2000
            read-timeout: 5000
      # 熔断：为所有 Feign 客户端包裹 circuit breaker（依赖 spring-cloud-starter-circuitbreaker-resilience4j）
      circuitbreaker:
        enabled: true

server:
  port: 8084

# 出站 RPC 弹性参数（仅对幂等 sink 调用生效）
payment:
  fulfillment:
    retry:
      max-attempts: 3
      backoff-ms: 200
  resolve:
    # /payments/{id}/resolve 收敛端点鉴权开关；启用但未配置 token 时返回 503 拒绝
    auth-enabled: true
    admin-token: ${PAYMENT_ADMIN_TOKEN:}
  # 支付可靠性（Feature 003 / ADR-0003~0005）
  reliability:
    timeout: 30s                       # PROCESSING 超此阈值且无明确结果 → UNKNOWN（ADR-0004）
    timeout-scan-interval-ms: 10000    # 超时扫描调度间隔（ADR-0004）
    retry-max-attempts: 3              # 幂等调用重试上限（含首次，ADR-0005）
    retry-scan-interval-ms: 5000       # 重试扫描调度间隔（退避由 next_retry_at 控制）
    query-max-attempts: 5              # UNKNOWN 主动查询尝试上限，达此停止自动查询（ADR-0003）
    query-interval-ms: 15000           # UNKNOWN 主动查询调度间隔（ADR-0003）

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
