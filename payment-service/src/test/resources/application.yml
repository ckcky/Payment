spring:
  datasource:
    url: jdbc:h2:mem:payment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 渠道路由（Feature 028 / ADR-0073）：测试 profile 的 application.yml 会**替换**主配置文件，
# 因此路由配置必须在此重新声明，否则 payment.routing.channels 为空 → 启动期强校验（FR-032）直接失败。
payment:
  routing:
    enabled: true
    channels:
      ALIPAY: { enabled: true,  priority: 10 }
      WECHAT: { enabled: true,  priority: 20 }
      DOUYIN: { enabled: false, priority: 30 }
      MOCK:   { enabled: true,  priority: 90 }
    availability: {}

  # 用户支付限额（spec 027 / ADR-0071）：测试同样需要显式声明（原因同上）。
  # **无 Redis 依赖**（SC-016）：测试环境没有 StringRedisTemplate → LimitConfiguration
  # 自动降级 NoopLimitExpiryIndex（alive 返回 null → 跳过回收 → 在途保持占用）。
  limit:
    enabled: true
    # 测试里把 TTL 压到较小值便于断言；仍须 ≥ 105s 下界，否则 LimitProperties.validate() fail-fast。
    reserve-ttl: 900s
    compensation-interval-ms: 30000
    redis:
      key-prefix: "limit:pending:"
