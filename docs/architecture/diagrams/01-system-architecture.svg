<svg viewBox="0 0 680 526" width="680" height="526" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PaymentArch 系统架构分层总览</title>
<desc>接入层之下分为编排层、执行层、资金层共十个微服务，最下方为 MySQL 每服务独立 Schema 的数据层。</desc>
<style>
text { font-family: "Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; }
.t { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 12px; fill: #888780; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect x="40" y="20" width="280" height="44" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text class="t" x="180" y="42" text-anchor="middle" dominant-baseline="central">调用方：用户 / 商户 / 运营</text>
<rect x="340" y="20" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text class="t" x="490" y="42" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">gateway：统一入口（MVP 延后）</text>
</g>
<path d="M180 66 L180 92" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="96" width="600" height="104" rx="20" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="tl" x="60" y="116" dominant-baseline="central">编排层 · 承接业务意图，编排跨域流程</text>
<g>
<rect x="60" y="126" width="177" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="149" y="144" text-anchor="middle" dominant-baseline="central">order-service</text>
<text class="ts" x="149" y="164" text-anchor="middle" dominant-baseline="central">8083 · order</text>
</g>
<g>
<rect x="251" y="126" width="177" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="340" y="144" text-anchor="middle" dominant-baseline="central">payment-service</text>
<text class="ts" x="340" y="164" text-anchor="middle" dominant-baseline="central">8084 · payment</text>
</g>
<g>
<rect x="442" y="126" width="177" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="531" y="144" text-anchor="middle" dominant-baseline="central">refund-service</text>
<text class="ts" x="531" y="164" text-anchor="middle" dominant-baseline="central">8085 · refund</text>
</g>
<path d="M340 202 L340 210" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="214" width="600" height="104" rx="20" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="tl" x="60" y="234" dominant-baseline="central">执行层 · 商品、交付与消费权利</text>
<g>
<rect x="60" y="244" width="177" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="149" y="262" text-anchor="middle" dominant-baseline="central">catalog-service</text>
<text class="ts" x="149" y="282" text-anchor="middle" dominant-baseline="central">8082 · catalog</text>
</g>
<g>
<rect x="251" y="244" width="177" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="340" y="262" text-anchor="middle" dominant-baseline="central">fulfillment-service</text>
<text class="ts" x="340" y="282" text-anchor="middle" dominant-baseline="central">8086 · fulfillment</text>
</g>
<g>
<rect x="442" y="244" width="177" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="531" y="262" text-anchor="middle" dominant-baseline="central">entitlement-service</text>
<text class="ts" x="531" y="282" text-anchor="middle" dominant-baseline="central">8087 · entitlement</text>
</g>
<path d="M340 320 L340 328" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="332" width="600" height="104" rx="20" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="tl" x="60" y="352" dominant-baseline="central">资金层 · 账务事实、核对与结算</text>
<g>
<rect x="60" y="362" width="131" height="56" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
<text class="t" x="126" y="380" text-anchor="middle" dominant-baseline="central">ledger-service</text>
<text class="ts" x="126" y="400" text-anchor="middle" dominant-baseline="central">8090 · ledger</text>
</g>
<g>
<rect x="203" y="362" width="131" height="56" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
<text class="t" x="269" y="380" text-anchor="middle" dominant-baseline="central">reconciliation</text>
<text class="ts" x="269" y="400" text-anchor="middle" dominant-baseline="central">8088 · recon</text>
</g>
<g>
<rect x="346" y="362" width="131" height="56" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
<text class="t" x="412" y="380" text-anchor="middle" dominant-baseline="central">settlement</text>
<text class="ts" x="412" y="400" text-anchor="middle" dominant-baseline="central">8089 · settlement</text>
</g>
<g>
<rect x="489" y="362" width="131" height="56" rx="8" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1"/>
<text class="t" x="555" y="380" text-anchor="middle" dominant-baseline="central">merchant</text>
<text class="ts" x="555" y="400" text-anchor="middle" dominant-baseline="central">8081 · 无独立库</text>
</g>
<path d="M340 438 L340 446" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="450" width="600" height="56" rx="8" fill="#F7F6F3" stroke="#888780" stroke-width="1"/>
<text class="t" x="340" y="470" text-anchor="middle" dominant-baseline="central">MySQL 8.0 · Database-per-Service</text>
<text class="ts" x="340" y="488" text-anchor="middle" dominant-baseline="central">9 个独立 Schema；跨 Schema 读写一律走对方 API，禁止直连</text>
</svg>
