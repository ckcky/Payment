<svg viewBox="0 0 680 578" width="680" height="578" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PaymentArch 资金闭环流程与复式记账映射</title>
<desc>资金从事实确认、复式记账、对账比对到结算批次的四步闭环，以及支付、退款、结算三类业务的借贷分录映射。</desc>
<style>
text { font-family: "Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; }
.t { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; fill: #5F5E5A; }
.tl { font-size: 12px; fill: #888780; }
.tm { font-size: 13px; fill: #2C2C2A; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="tl" x="40" y="12" dominant-baseline="central">资金闭环</text>
<g>
<rect x="40" y="20" width="600" height="56" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<text class="t" x="60" y="40" dominant-baseline="central">1 · 事实确认</text>
<text class="ts" x="60" y="58" dominant-baseline="central">支付或退款到达 SUCCEEDED 终态；UNKNOWN 与处理中不记账、不结算</text>
</g>
<path d="M340 78 L340 92" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="96" width="600" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="60" y="116" dominant-baseline="central">2 · 复式记账</text>
<text class="ts" x="60" y="134" dominant-baseline="central">按映射写平衡分录，幂等键隔离来源，重复请求返回首次 Posting</text>
</g>
<path d="M340 154 L340 168" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="172" width="600" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="60" y="192" dominant-baseline="central">3 · 对账比对</text>
<text class="ts" x="60" y="210" dominant-baseline="central">与渠道账单比对产出差异记录，只记录差异，永不修改原始支付与退款事实</text>
</g>
<path d="M340 230 L340 244" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="248" width="600" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="t" x="60" y="268" dominant-baseline="central">4 · 结算批次</text>
<text class="ts" x="60" y="286" dominant-baseline="central">只消费已确认且差异可解释的事实，按商户周期幂等生成批次并记账</text>
</g>

<text class="tl" x="40" y="332" dominant-baseline="central">复式记账映射</text>
<text class="tl" x="95" y="332" text-anchor="middle" dominant-baseline="central">场景</text>
<text class="tl" x="272" y="332" text-anchor="middle" dominant-baseline="central">借方 DEBIT</text>
<text class="tl" x="507" y="332" text-anchor="middle" dominant-baseline="central">贷方 CREDIT</text>

<g>
<rect x="40" y="344" width="110" height="64" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="t" x="95" y="376" text-anchor="middle" dominant-baseline="central">支付成功</text>
<rect x="160" y="344" width="225" height="64" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="tm" x="272" y="376" text-anchor="middle" dominant-baseline="central">CUSTOMER_CASH　A</text>
<rect x="395" y="344" width="225" height="64" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="tm" x="507" y="366" text-anchor="middle" dominant-baseline="central">MERCHANT_PAYABLE　N</text>
<text class="tm" x="507" y="390" text-anchor="middle" dominant-baseline="central">PLATFORM_FEE_REVENUE　F</text>
</g>

<g>
<rect x="40" y="420" width="110" height="44" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="t" x="95" y="442" text-anchor="middle" dominant-baseline="central">退款成功</text>
<rect x="160" y="420" width="225" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="tm" x="272" y="442" text-anchor="middle" dominant-baseline="central">MERCHANT_PAYABLE　R</text>
<rect x="395" y="420" width="225" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="tm" x="507" y="442" text-anchor="middle" dominant-baseline="central">CUSTOMER_CASH　R</text>
</g>

<g>
<rect x="40" y="476" width="110" height="44" rx="8" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="t" x="95" y="498" text-anchor="middle" dominant-baseline="central">结算批次</text>
<rect x="160" y="476" width="225" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="tm" x="272" y="498" text-anchor="middle" dominant-baseline="central">MERCHANT_PAYABLE　S</text>
<rect x="395" y="476" width="225" height="44" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/>
<text class="tm" x="507" y="498" text-anchor="middle" dominant-baseline="central">SETTLEMENT_PAYABLE　S</text>
</g>

<text class="ts" x="40" y="540" dominant-baseline="central">A 支付额，F 平台手续费，N = A − F 商户净额，R 实退金额，S 结算净额</text>
<text class="ts" x="40" y="558" dominant-baseline="central">每个 Posting 借贷必须平衡；分录不可变，更正只能新增反向分录</text>
</svg>
