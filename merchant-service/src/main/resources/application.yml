spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
  application:
    name: merchant-service

  lifecycle:
    # 优雅停机排水上限：SIGTERM 后在途请求最多等 30s（spec 023 / M5）
    timeout-per-shutdown-phase: 30s

server:
  port: 8081
  # 优雅停机：等在途请求完成再关闭（spec 023 / M5）
  shutdown: graceful

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # P99 面板依赖 http_server_requests_seconds_bucket
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
