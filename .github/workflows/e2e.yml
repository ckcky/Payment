name: e2e-nightly

# spec 022 / FR-014 / SC-006：全链路 E2E 门禁（D4——PR 不跑，nightly + 手动 + release 前强制）
on:
  schedule:
    - cron: '0 18 * * *'      # 每日 02:00 UTC+8（nightly）
  workflow_dispatch:           # release 前手动强制执行
  push:
    tags:
      - 'v*'                   # 打 tag（release）时强制

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ── 依赖就绪（MySQL + Redis）─────────────────────────────────────────
    # 用 service container 而非宿主 systemd：宿主 ubuntu-24.04 镜像的 mysql 包
    # root@localhost 默认走 auth_socket/caching_sha2，`sudo mysql` 无密码连接自
    # 20260907 镜像起不再放行（ERROR 1045，见 fix/ci-mysql-bootstrap），
    # 且宿主实例没有固定凭据契约。service container 用官方镜像 + MYSQL_ROOT_PASSWORD，
    # 凭据确定、版本确定，也不再依赖 `sudo apt-get update` / `systemctl`。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for MySQL / Redis
        run: |
          # MySQL：service container 自带 mysql 客户端（runner 镜像预装 mysql-client）
          for i in $(seq 1 60); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break || sleep 2
          done
          mysqladmin ping -h 127.0.0.1 -uroot -proot --silent \
            || { echo "MySQL 未就绪"; exit 1; }
          # Redis：runner 镜像**不预装 redis-cli**（2026-09-17 实测 command not found），
          # 用 bash 内建 /dev/tcp 发 PING、读 PONG，零额外工具依赖。
          ok=0
          for i in $(seq 1 30); do
            if exec 3<>/dev/tcp/127.0.0.1/6379 2>/dev/null; then
              printf 'PING\r\n' >&3
              if head -c 7 <&3 | grep -q PONG; then ok=1; exec 3<&-; break; fi
              exec 3<&-
            fi
            sleep 2
          done
          [ "$ok" = "1" ] || { echo "Redis 未就绪"; exit 1; }
          echo "MySQL / Redis 就绪"

      # 建库 + 重放业务表 DDL。
      # 两者原先都缺失：workflow 只 CREATE DATABASE，从不建表 → 服务起来后
      # 首个业务请求即报 "Table doesn't exist"。
      #
      # 重放范围（与 demo/reset.sh 同口径 + 027）：
      #   ① NN-*.sql（01–10）——「全量 schema」，各文件自带 CREATE DATABASE + USE，
      #      已吸收 015/016/018/019 的变更（如 transaction_refunds、attempt_type、
      #      order_item_no 均已在 01/03 内），故不再单独重放那批存量迁移脚本
      #      （它们前置 USE、依赖 DATABASE()，无库时会报 1046）。
      #   ② 027-user-payment-limit.sql——同样是自带 CREATE DATABASE 的幂等全量脚本，
      #      其 3 张限额表尚未并入 03，必须显式重放（否则 spec 027 相关用例全红）。
      - name: Create schemas & apply DDL
        run: |
          for f in deployment/schema/[0-9][0-9]-*.sql deployment/schema/027-*.sql; do
            echo "applying $(basename "$f")"
            mysql -h 127.0.0.1 -uroot -proot < "$f"
          done
          mysql -h 127.0.0.1 -uroot -proot -e \
            "SELECT table_schema, COUNT(*) AS tables FROM information_schema.tables \
             WHERE table_schema IN ('catalog','order','payment','fulfillment','entitlement', \
             'reconciliation','settlement','ledger','merchant') GROUP BY table_schema ORDER BY table_schema;"

      - name: Start Nacos (standalone)
        run: |
          # 必须同时发布 9848/9849：Nacos 2.x 客户端在 8848 完成 HTTP 协商后
          # 改走 gRPC（主端口 +1000/+1001）。只映射 8848 时服务注册报
          # "ErrCode:-401, ErrMsg:Client not connected, current status:STARTING"，
          # 9 个依赖 Nacos 的服务全部启动失败（2026-09-17 实测）。
          # 同一坑已在 deployment/docker-compose.yml 的 nacos.ports 注释里记录。
          docker run -d --name nacos -e MODE=standalone -e NACOS_AUTH_ENABLE=false \
            -p 8848:8848 -p 9848:9848 -p 9849:9849 nacos/nacos-server:v2.3.2
          # 就绪探针认 naming operator/metrics（Nacos 3.x 起 /nacos/actuator/health 已移除，
          # 2.x 应查此端点），不能只看根路径能不能连上——端口开≠服务可注册。
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8848/nacos/v1/ns/operator/metrics 2>/dev/null | grep -q UP && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8848/nacos/v1/ns/operator/metrics 2>/dev/null | grep -q UP \
            || { echo "Nacos 未就绪"; docker logs --tail 50 nacos; exit 1; }
          echo "Nacos 就绪"

      - name: Package (skip tests — E2E 阶段单独跑)
        run: ./mvnw -B -DskipTests package

      - name: Start 9 services + mock-channel-web
        env:
          # mock-cashier 置 true（与本地/演示默认一致）。原先显式置 false 是
          # fix/024 的取舍（怕收银台环节打断 paidOrder），但 paidOrder 走的是
          # ALIPAY 内联同步 charge（建支付单即 SUCCEEDED），本就不经收银台；
          # 而置 false 会让 payUrl 恒为 null，CashierPayUrlReachabilityTest
          # （2026-09-15 缺陷回归用例）必然失败。两相权衡取 true。
          PAYMENT_MOCK_CASHIER_ENABLED: "true"
          # 人工收敛端点的鉴权令牌。未设置时 /payments/{no}/resolve 直接 503
          # （拒绝而非放行，ADR 原文如此），IdempotencyAndCallbackE2ETest 的
          # 「丢回调经 resolve 收敛」用例必然失败。本地 start-all.sh 默认导出
          # demo-admin-token，CI 此前遗漏——这里补齐同一演示值。
          PAYMENT_ADMIN_TOKEN: "demo-admin-token"
          # 冷启动放大出站 RPC 超时：10 JVM 首次调用常超硬编码的 1s（ADR-0012 口径），
          # 触发 feign.RetryableException: Read timed out（createPayment 等 500），
          # 故 CI 经环境变量放大——源码默认仍 1s，仅覆盖 CI 冷启动窗口。
          PAYMENT_FEIGN_CONNECT_TIMEOUT_MS: "2000"
          PAYMENT_FEIGN_READ_TIMEOUT_MS: "5000"
          PAYMENT_FACTS_CONNECT_TIMEOUT_MS: "2000"
          PAYMENT_FACTS_READ_TIMEOUT_MS: "8000"
        run: |
          mkdir -p logs
          for jar in deployment/output/jars/*.jar; do
            name=$(basename "$jar" .jar)
            nohup java -jar "$jar" > "logs/${name}.log" 2>&1 &
            echo "started ${name}"
          done
          # 轮询 health（10 端口，最长 180s）
          for i in $(seq 1 90); do
            ok=1
            for p in 8081 8082 8083 8084 8086 8087 8088 8089 8090 8091; do
              code=$(curl -s --noproxy '*' -o /dev/null -w "%{http_code}" -m 2 "http://localhost:${p}/actuator/health" || true)
              [ "$code" = "200" ] || ok=0
            done
            [ "$ok" = "1" ] && echo "all services healthy" && break
            sleep 2
          done
          # 失败时打印每个服务的 health 码 + 各自日志尾部。
          # 注意不要用 `tail -50 logs/*.log`——GNU coreutils 下多文件 + 数值选项
          # 会报 "option used in invalid context"，真正的失败原因反而被这条吞掉
          # （2026-09-17 实测：排障消息本身盖住了排障信息）。
          if [ "$ok" != "1" ]; then
            echo "==== health 汇总 ===="
            for p in 8081 8082 8083 8084 8086 8087 8088 8089 8090 8091; do
              code=$(curl -s --noproxy '*' -o /dev/null -w "%{http_code}" -m 2 "http://localhost:${p}/actuator/health" || true)
              echo "  :${p} -> ${code}"
            done
            for f in logs/*.log; do
              echo "==== ${f} (tail -60) ===="
              tail -n 60 "$f" || true
            done
            exit 1
          fi

      - name: Run E2E (-De2e.env=ci)
        run: ./mvnw -B -pl deployment/e2e-tests test -De2e.env=ci

      # ── spec 033 §13.1 / 033-E：demo 场景挂载 nightly（不重写为 Java，复用演示脚本权威）────
      # 只挂离线可跑的五个场景（spec 033 §16 R6：涉沙箱的 routing 排除；limit/unknown
      # 需要专用环境开关，维持手工口径）。demo/reset.sh 经 MYSQL_CONTAINER / REDIS_CONTAINER
      # 适配 service container（033 改造，本地 compose 默认名不变）。
      - name: Discover service containers for demo scripts
        run: |
          MYSQL_ID=$(docker ps --filter ancestor=mysql:8.0 --format '{{.ID}}' | head -n1)
          REDIS_ID=$(docker ps --filter ancestor=redis:7 --format '{{.ID}}' | head -n1)
          [ -n "$MYSQL_ID" ] || { echo "未发现 MySQL service container"; exit 1; }
          [ -n "$REDIS_ID" ] || { echo "未发现 Redis service container"; exit 1; }
          echo "MYSQL_CONTAINER=$MYSQL_ID" >> "$GITHUB_ENV"
          echo "REDIS_CONTAINER=$REDIS_ID" >> "$GITHUB_ENV"

      - name: Reset demo data & run offline demo scenarios
        run: |
          bash deployment/demo/reset.sh
          for s in scenario-happy-path.sh scenario-audit.sh scenario-mq.sh scenario-reconciliation.sh scenario-refund.sh; do
            echo "== demo scenario: $s =="
            bash "deployment/demo/$s"
          done

      - name: Assert ACCESS_LOG presence (spec 033 §13.1)
        run: |
          hits=$(grep -l "ACCESS_LOG" logs/*.log | wc -l)
          echo "含 ACCESS_LOG 记录的日志文件数：$hits"
          [ "$hits" -ge 5 ] || { echo "ACCESS_LOG 缺失——请求日志链路异常"; exit 1; }

      - name: Upload surefire reports & failure dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            deployment/e2e-tests/target/surefire-reports/
            deployment/e2e-tests/target/e2e-dump/
            logs/
          retention-days: 14

  # ── spec 033 §12#4：顺序无关（可乱序）──────────────────────────────────
  # 全量单元层以随机顺序重跑，检测测试间隐式依赖（共享静态状态 / 文件残留）。
  # 只在 nightly 跑（比 alphabetical 慢、且失败复现依赖 surefire 打印的 runOrder）。
  # 排除 real-db 组：该层由 verify.yml 的 real-db job（skip 即红）单独门禁，
  # 这里不重复起容器，保持随机序 job 聚焦单元层顺序独立性。
  # 失败时 surefire 会输出当次随机 runOrder，可据此本地复现。
  verify-random-order:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify with random test order
        run: >
          ./mvnw -B verify -fae
          -Dsurefire.runOrder=random
          -DexcludedGroups=real-db
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-random-order
          path: '**/target/surefire-reports/'
          retention-days: 7
