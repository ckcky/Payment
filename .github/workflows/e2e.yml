name: e2e-nightly

# spec 022 / FR-014 / SC-006：全链路 E2E 门禁（D4——PR 不跑，nightly + 手动 + release 前强制）
on:
  schedule:
    - cron: '0 18 * * *'      # 每日 02:00 UTC+8（nightly）
  workflow_dispatch:           # release 前手动强制执行
  push:
    tags:
      - 'v*'                   # 打 tag（release）时强制

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ── 依赖就绪（MySQL + Redis）─────────────────────────────────────────
    # 用 service container 而非宿主 systemd：宿主 ubuntu-24.04 镜像的 mysql 包
    # root@localhost 默认走 auth_socket/caching_sha2，`sudo mysql` 无密码连接自
    # 20260907 镜像起不再放行（ERROR 1045，见 fix/ci-mysql-bootstrap），
    # 且宿主实例没有固定凭据契约。service container 用官方镜像 + MYSQL_ROOT_PASSWORD，
    # 凭据确定、版本确定，也不再依赖 `sudo apt-get update` / `systemctl`。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for MySQL / Redis
        run: |
          # MySQL：service container 自带 mysql 客户端（runner 镜像预装 mysql-client）
          for i in $(seq 1 60); do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break || sleep 2
          done
          mysqladmin ping -h 127.0.0.1 -uroot -proot --silent \
            || { echo "MySQL 未就绪"; exit 1; }
          # Redis：runner 镜像**不预装 redis-cli**（2026-09-17 实测 command not found），
          # 用 bash 内建 /dev/tcp 发 PING、读 PONG，零额外工具依赖。
          ok=0
          for i in $(seq 1 30); do
            if exec 3<>/dev/tcp/127.0.0.1/6379 2>/dev/null; then
              printf 'PING\r\n' >&3
              if head -c 7 <&3 | grep -q PONG; then ok=1; exec 3<&-; break; fi
              exec 3<&-
            fi
            sleep 2
          done
          [ "$ok" = "1" ] || { echo "Redis 未就绪"; exit 1; }
          echo "MySQL / Redis 就绪"

      # 建库 + 重放业务表 DDL。
      # 两者原先都缺失：workflow 只 CREATE DATABASE，从不建表 → 服务起来后
      # 首个业务请求即报 "Table doesn't exist"。
      #
      # 重放范围（与 demo/reset.sh 同口径 + 027）：
      #   ① NN-*.sql（01–10）——「全量 schema」，各文件自带 CREATE DATABASE + USE，
      #      已吸收 015/016/018/019 的变更（如 transaction_refunds、attempt_type、
      #      order_item_no 均已在 01/03 内），故不再单独重放那批存量迁移脚本
      #      （它们前置 USE、依赖 DATABASE()，无库时会报 1046）。
      #   ② 027-user-payment-limit.sql——同样是自带 CREATE DATABASE 的幂等全量脚本，
      #      其 3 张限额表尚未并入 03，必须显式重放（否则 spec 027 相关用例全红）。
      - name: Create schemas & apply DDL
        run: |
          for f in deployment/schema/[0-9][0-9]-*.sql deployment/schema/027-*.sql; do
            echo "applying $(basename "$f")"
            mysql -h 127.0.0.1 -uroot -proot < "$f"
          done
          mysql -h 127.0.0.1 -uroot -proot -e \
            "SELECT table_schema, COUNT(*) AS tables FROM information_schema.tables \
             WHERE table_schema IN ('catalog','order','payment','fulfillment','entitlement', \
             'reconciliation','settlement','ledger','merchant') GROUP BY table_schema ORDER BY table_schema;"

      - name: Start Nacos (standalone)
        run: |
          # 必须同时发布 9848/9849：Nacos 2.x 客户端在 8848 完成 HTTP 协商后
          # 改走 gRPC（主端口 +1000/+1001）。只映射 8848 时服务注册报
          # "ErrCode:-401, ErrMsg:Client not connected, current status:STARTING"，
          # 9 个依赖 Nacos 的服务全部启动失败（2026-09-17 实测）。
          # 同一坑已在 deployment/docker-compose.yml 的 nacos.ports 注释里记录。
          docker run -d --name nacos -e MODE=standalone -e NACOS_AUTH_ENABLE=false \
            -p 8848:8848 -p 9848:9848 -p 9849:9849 nacos/nacos-server:v2.3.2
          # 就绪探针认 naming operator/metrics（Nacos 3.x 起 /nacos/actuator/health 已移除，
          # 2.x 应查此端点），不能只看根路径能不能连上——端口开≠服务可注册。
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8848/nacos/v1/ns/operator/metrics 2>/dev/null | grep -q UP && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8848/nacos/v1/ns/operator/metrics 2>/dev/null | grep -q UP \
            || { echo "Nacos 未就绪"; docker logs --tail 50 nacos; exit 1; }
          echo "Nacos 就绪"

      - name: Package (skip tests — E2E 阶段单独跑)
        run: ./mvnw -B -DskipTests package

      - name: Start 9 services + mock-channel-web
        env:
          # e2e 的 paidOrder 依赖渠道内联同步 charge（建支付单即 SUCCEEDED，无收银台环节）；
          # mock-cashier 默认已翻为 true（演示优先），CI 必须显式关闭（fix/024-mock-cashier-default-on）
          PAYMENT_MOCK_CASHIER_ENABLED: "false"
        run: |
          mkdir -p logs
          for jar in deployment/output/jars/*.jar; do
            name=$(basename "$jar" .jar)
            nohup java -jar "$jar" > "logs/${name}.log" 2>&1 &
            echo "started ${name}"
          done
          # 轮询 health（10 端口，最长 180s）
          for i in $(seq 1 90); do
            ok=1
            for p in 8081 8082 8083 8084 8086 8087 8088 8089 8090 8091; do
              code=$(curl -s --noproxy '*' -o /dev/null -w "%{http_code}" -m 2 "http://localhost:${p}/actuator/health" || true)
              [ "$code" = "200" ] || ok=0
            done
            [ "$ok" = "1" ] && echo "all services healthy" && break
            sleep 2
          done
          # 失败时打印每个服务的 health 码 + 各自日志尾部。
          # 注意不要用 `tail -50 logs/*.log`——GNU coreutils 下多文件 + 数值选项
          # 会报 "option used in invalid context"，真正的失败原因反而被这条吞掉
          # （2026-09-17 实测：排障消息本身盖住了排障信息）。
          if [ "$ok" != "1" ]; then
            echo "==== health 汇总 ===="
            for p in 8081 8082 8083 8084 8086 8087 8088 8089 8090 8091; do
              code=$(curl -s --noproxy '*' -o /dev/null -w "%{http_code}" -m 2 "http://localhost:${p}/actuator/health" || true)
              echo "  :${p} -> ${code}"
            done
            for f in logs/*.log; do
              echo "==== ${f} (tail -60) ===="
              tail -n 60 "$f" || true
            done
            exit 1
          fi

      - name: Run E2E (-De2e.env=ci)
        run: ./mvnw -B -pl deployment/e2e-tests test -De2e.env=ci

      - name: Upload surefire reports & failure dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            deployment/e2e-tests/target/surefire-reports/
            deployment/e2e-tests/target/e2e-dump/
            logs/
          retention-days: 14
