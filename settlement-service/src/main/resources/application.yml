spring:
  application:
    name: settlement-service
  datasource:
    url: jdbc:mysql://localhost:3306/settlement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
    openfeign:
      client:
        config:
          default:
            # 出站 RPC 超时：connect/read 各 1s（ADR-0012 超时口径，全服务统一）
            connect-timeout: 1000
            read-timeout: 1000

server:
  port: 8089

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # P99 面板依赖 http_server_requests_seconds_bucket
        http.client.requests: true  # RPC 面板依赖 http_client_requests_seconds_bucket（Feign）
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

services:
  merchant:
    url: http://localhost:8081
  reconciliation:
    url: http://localhost:8088
  ledger:
    url: http://localhost:8090

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
