spring:
  application:
    name: settlement-service
  datasource:
    url: jdbc:mysql://localhost:3306/settlement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
    openfeign:
      client:
        config:
          default:
            # 出站 RPC 超时：connect/read 各 1s（ADR-0012 超时口径，全服务统一）
            connect-timeout: 1000
            read-timeout: 1000

  lifecycle:
    # 优雅停机排水上限：SIGTERM 后在途请求最多等 30s（spec 023 / M5）
    timeout-per-shutdown-phase: 30s

server:
  port: 8089
  # 优雅停机：等在途请求完成再关闭（spec 023 / M5）
  shutdown: graceful

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # P99 面板依赖 http_server_requests_seconds_bucket
        http.client.requests: true  # RPC 面板依赖 http_client_requests_seconds_bucket（Feign）
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
