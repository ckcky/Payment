apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
  # 日志聚合：Promtail 采集宿主 deployment/logs/*.log -> Loki（Explore / 日志面板查询）
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
