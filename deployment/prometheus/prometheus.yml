# Prometheus 抓取配置：PaymentArch 本地可观测
#
# 服务以宿主进程运行（`./mvnw spring-boot:run`，非容器），
# 故抓取目标用 host.docker.internal 访问宿主（Docker Desktop 下自动解析）。
# 各服务暴露 /actuator/prometheus（见各服务 application.yml 的 management.* 配置）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/payment-alerts.yml"

scrape_configs:
  - job_name: "merchant"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: "catalog"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: "order"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: "payment"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8084"]

  - job_name: "fulfillment"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8086"]

  - job_name: "entitlement"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8087"]

  - job_name: "reconciliation"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8088"]

  - job_name: "settlement"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8089"]

  - job_name: "ledger"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8090"]

  # mock-channel-web（演示组件，ADR-0048 修订版）：非领域服务，仅观测演示流量
  - job_name: "mock-channel-web"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8091"]
