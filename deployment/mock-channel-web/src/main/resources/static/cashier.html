<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- UI 规范：docs/design/DESIGN.md（Feature 024 · Apple 基底）——改样式前先读它；token 在 /design.css -->
<link rel="stylesheet" href="/design.css">
<title>Mock 渠道收银台 — PaymentArch 演示</title>
<style>
  .cashier { max-width: 420px; margin: 40px auto 0; }
  .merchant { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .merchant .name { font-size: 15px; font-weight: 600; }
  .merchant .sub { font-size: 12px; color: var(--pa-ink-3); margin-top: 4px; font-variant-numeric: tabular-nums; word-break: break-all; }
  .neutral-chip { flex: none; font-size: 11px; padding: 3px 10px; border-radius: var(--pa-r-pill); background: var(--pa-canvas-2); color: var(--pa-ink-3); }
  .amount-row { padding: 28px 0 24px; border-bottom: 1px solid var(--pa-hairline); }
  .pay-row { padding: 24px 0; }
  .scenes { border-top: 1px solid var(--pa-hairline); }
  .scenes .pa-disc__head { padding-left: 0; padding-right: 0; }
  .scene-group { padding: 8px 0; }
  .scene-group .gt { font-size: 12px; color: var(--pa-ink-3); padding: 4px 0; }
  .scenes .pa-btn { width: 100%; justify-content: flex-start; }
  .fineprint { font-size: 12px; color: var(--pa-ink-3); line-height: 1.7; padding: 16px 0 4px; }
  .ch-seg { padding-bottom: 8px; }
  .ch-note { font-size: 11.5px; color: var(--pa-ink-3); line-height: 1.6; margin-top: 10px; }
  .ch-note b { color: var(--pa-ink-2); font-weight: 600; }
</style>
</head>
<body>
<div class="pa-main">
  <div class="cashier">
    <div class="pa-card">
      <!-- 1 商户条 -->
      <div class="merchant">
        <div>
          <div class="name">PaymentArch 演示商户</div>
          <div class="sub" id="meta">加载中…</div>
        </div>
        <span class="neutral-chip">演示 · 非真实渠道</span>
      </div>

      <!-- 2 金额 -->
      <div class="amount-row">
        <div class="pa-eyebrow">应付金额</div>
        <div class="pa-amount" id="amount" style="margin-top:8px">—</div>
      </div>

        <!-- 3 支付方式（分段控件）-->
      <div class="pay-row">
        <div class="pa-eyebrow" style="margin-bottom:8px">支付方式（切换渠道）</div>
        <div class="pa-seg pa-seg--block ch-seg" id="chSeg">
          <button type="button" data-ch="ALIPAY" onclick="switchChannel('ALIPAY')">支付宝</button>
          <button type="button" data-ch="WECHAT" onclick="switchChannel('WECHAT')">微信</button>
          <button type="button" data-ch="DOUYIN" onclick="switchChannel('DOUYIN')">抖音</button>
          <button type="button" data-ch="MOCK" onclick="switchChannel('MOCK')">Mock</button>
        </div>
        <div class="ch-note">切换渠道 = 为该订单<b>新建一张支付单</b>（旧支付单保留原状态），随后自动跳转新收银台。</div>

        <!-- 4 主 CTA：近黑胶囊（HIG：Apple Pay 按钮只有 black/white/white-outline）-->
        <button class="pa-btn dark pa-btn--block" style="margin-top:16px;height:48px" onclick="pay('SUCCESS')">
          确认支付 <span id="ctaAmount"></span>
        </button>
      </div>

      <!-- 5 更多支付场景 -->
      <div class="scenes">
        <div class="pa-disc is-open">
          <button class="pa-disc__head" type="button">
            <span class="caret">›</span><span>更多支付场景</span><span class="cnt">5 项</span>
          </button>
          <div class="pa-disc__body"><div>
            <div class="scene-group">
              <div class="gt">异常结果</div>
              <div class="pa-row">
                <button class="pa-btn ghost" onclick="pay('FAILURE')">支付失败</button>
                <button class="pa-btn ghost" onclick="noCallback()">超时不回调</button>
                <button class="pa-btn ghost" onclick="pay('UNKNOWN')">无结论 UNKNOWN</button>
              </div>
            </div>
            <div class="scene-group">
              <div class="gt">可靠性验证</div>
              <div class="pa-row">
                <button class="pa-btn ghost" onclick="payTwice()">重复回调 ×2</button>
                <button class="pa-btn ghost" onclick="payForged()">伪造签名</button>
              </div>
            </div>
          </div></div>
        </div>
      </div>

      <!-- 6 说明 -->
      <div class="fineprint">
        「超时不回调」不发送任何请求：payment 30s 后转 UNKNOWN，主动查询不收敛 —— 这是「不猜成败落账」要演示的正确性能力。<br>
        「伪造签名」以错误密钥签名，payment 验签失败返回 403（ADR-0052 fail-closed）。<br>
        换渠道（Feature 015 / INV-2）：同一订单每次选渠道都会<b>新建一张支付单</b>，旧支付单保留原状态；切换后自动跳转新收银台。
      </div>
    </div>
  </div>
</div>

<div id="log"></div>

<script src="/app.js"></script>
<script>
const log = PA.log;
const qs = new URLSearchParams(location.search);
const paymentNo = qs.get('paymentNo');
const orderNo = qs.get('orderNo');
const amountMinor = qs.get('amountMinor');
const currencyCode = qs.get('currencyCode') || 'CNY';
const channelCode = qs.get('channelCode') || 'MOCK';

const CHANNEL_NAMES = { ALIPAY: '支付宝', WECHAT: '微信支付', DOUYIN: '抖音支付', MOCK: 'Mock 渠道' };

document.getElementById('meta').innerHTML =
  'paymentNo: <b>' + (paymentNo || '缺失') + '</b> · orderNo: <b>' + (orderNo || '—') + '</b>'
  + '<br>当前渠道: <b>' + (CHANNEL_NAMES[channelCode] || channelCode) + '</b>';
// 金额：display 40px/600/tnum + 弱化币种小字（DESIGN.md §3）
document.getElementById('amount').innerHTML =
  amountMinor ? '¥' + (Number(amountMinor) / 100).toFixed(2) + ' <small>' + currencyCode + '</small>' : '（金额未随链路携带）';
document.getElementById('ctaAmount').textContent =
  amountMinor ? '¥' + (Number(amountMinor) / 100).toFixed(2) : '';
// 分段控件：当前渠道高亮
document.querySelectorAll('#chSeg button').forEach(function (b) {
  if (b.getAttribute('data-ch') === channelCode) b.className = 'is-on';
});

async function sendCallback(status, signMode, extra) {
  const payload = Object.assign({
    paymentNo: paymentNo,
    status: status,
    channelReference: 'demo-ref-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)),
    reason: null,
    amountMinor: amountMinor ? Number(amountMinor) : null,
    signMode: signMode || 'VALID'
  }, extra || {});
  log('>> POST /mock-channel/callback  status=' + status + '  signMode=' + (signMode || 'VALID'));
  const res = await fetch('/mock-channel/callback', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
  });
  const data = await res.json();
  log('<< HTTP ' + res.status + '  ' + JSON.stringify(data));
  if (data.body && data.body.indexOf('"status"') >= 0) {
    try {
      const p = JSON.parse(data.body);
      log('   payment 状态 → ' + p.status);
      if (p.status === 'SUCCEEDED') PA.toast('支付成功（SUCCEEDED），可返回演示控制台继续', 'ok');
    } catch (e) { /* 保留原始 body 日志 */ }
  }
  if (res.status === 403) PA.toast('验签失败 403：业务层零触达（ADR-0052 fail-closed）', 'bad');
  return res;
}

async function pay(status) { await sendCallback(status, 'VALID'); }
function noCallback() {
  log('>> （不发送任何回调）');
  log('   预期：payment 30s 后转 UNKNOWN（payment.reliability.timeout=30s），');
  log('   随后主动查询（15s 间隔 × 5 次）仍无结论 → 停留 UNKNOWN，不履约不记账。');
  log('   回演示控制台可继续观察轮询结果。');
  PA.toast('不发送回调：预期 30s 后转 UNKNOWN', 'ok');
}
async function payTwice() {
  log('== 连发两次相同回调（演示幂等吸收）==');
  await sendCallback('SUCCESS', 'VALID');
  await sendCallback('SUCCESS', 'VALID');
  log('   预期：第二次被终态吸收（payment.duplicate_callback 指标 +1，不重复入账）。');
}
async function payForged() {
  await sendCallback('SUCCESS', 'FORGED');
  log('   预期：HTTP 403 —— payment 验签失败拒绝，业务层零触达（ADR-0052）。');
}

// Feature 015 / INV-2：显式换渠道 → order-service 新建一张支付单（同订单号），跳转新收银台。
async function switchChannel(target) {
  if (!orderNo) { log('!! 缺少 orderNo，无法换渠道'); PA.toast('缺少 orderNo，无法换渠道', 'bad'); return; }
  if (target === channelCode) { log('   当前已是 ' + (CHANNEL_NAMES[target] || target) + '，无需切换'); return; }
  log('== 换渠道：' + (CHANNEL_NAMES[target] || target) + ' → POST /orders/' + orderNo + '/payments ==');
  try {
    const res = await fetch('/proxy/order/orders/' + encodeURIComponent(orderNo) + '/payments', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ channelCode: target })
    });
    const text = await res.text();
    log('<< HTTP ' + res.status + '  ' + text);
    if (res.ok) {
      const data = JSON.parse(text);
      log('   新支付单 paymentNo=' + data.paymentNo + ' attemptSeq=' + data.attemptSeq
          + ' 渠道=' + (CHANNEL_NAMES[target] || target));
      if (data.payUrl) {
        log('   正在跳转新支付单收银台…');
        PA.toast('已新建支付单，正在跳转…', 'ok');
        setTimeout(() => { location.href = data.payUrl; }, 800);
      } else {
        log('   （新支付单无 payUrl —— mock-cashier 未开启时请经 API 继续支付）');
      }
    } else {
      log('   换渠道失败：' + (text || res.status));
      PA.toast('换渠道失败：HTTP ' + res.status, 'bad');
    }
  } catch (e) {
    log('!! 换渠道请求异常：' + e);
  }
}
if (!paymentNo) { log('!! 缺少 paymentNo 查询参数 —— 请从演示控制台下单后跳转。'); }
</script>
</body>
</html>
