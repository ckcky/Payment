spring:
  application:
    name: mock-channel-web
  # 静态页（/demo.html、/cashier.html）一律 no-store：演示页迭代频繁，
  # 避免浏览器启发式缓存导致"改了看不到"（2026-09-04 用户复现：页面停留在旧版）。
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  # 全链路 DB 诊断（/demo/trace）只读连接：各服务库共实例（见 deployment/schema/*.sql），
  # 查询一律用「库名.表名」限定（`order` 是 MySQL 保留字，SQL 中需反引号）。
  # 演示环境连接 docker-compose 的 payment-mysql（3306 已映射宿主机，root/root）。
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      # MySQL 容器未启动时不阻断应用启动：首查报错由 /demo/trace 各 section 兜底展示
      initialization-fail-timeout: -1

server:
  port: 8091

# Mock 渠道配置（ADR-0048 修订版）
mock-channel:
  # 与 payment-service 的 PAYMENT_CHANNEL_SECRET 同源：转发回调用同一密钥签名，
  # "伪造签名"演示（FORGED）才能在 payment 侧验签失败返回 403（ADR-0052 fail-closed）。
  # 两侧都为空时 payment 侧放行 + WARN（开发态边界）——演示环境由 start-all.sh 显式 export。
  secret: ${PAYMENT_CHANNEL_SECRET:}
  # /proxy/{service}/** 的转发目标（同源代理，避免 CORS）
  services:
    merchant: http://localhost:8081
    catalog: http://localhost:8082
    order: http://localhost:8083
    payment: http://localhost:8084
    refund: http://localhost:8085
    fulfillment: http://localhost:8086
    entitlement: http://localhost:8087

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # P99 面板依赖 http_server_requests_seconds_bucket
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
