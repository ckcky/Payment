  # 演示组件（ADR-0048 修订版），非领域服务。
  # 关键：mock-channel.services.* 在 application.yml 里硬编码为 localhost:8081~8090，
  # 而它作为**同源代理**由浏览器调用，容器化后必须指向容器服务名，否则 /proxy/** 全部 502。
  # 环境变量键名由 Spring relaxed binding 映射到 mock-channel.services.<name>。
  # 注意：这里的代理目标是**容器间**地址，与浏览器访问无关（浏览器仍走宿主 8091）。
  mock-channel-web:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        JAR_FILE: deployment/output/jars/mock-channel-web-0.1.0-SNAPSHOT.jar
        SERVICE_PORT: 8091
    image: paymentarch/mock-channel-web:local
    container_name: payment-mock-channel-web
    profiles: ["full"]
    # 内存硬上限：Docker Desktop 默认配额 7.75GiB，10 个 JVM 必须各自受限，
    # 否则单一 JVM 失控会顶穿 VM 内存致全部容器 Exited(255)（2026-09-15 实测）。
    mem_limit: 512m
    ports:
      - "8091:8091"
    environment:
      # 容器日志落挂载卷（与宿主模式共用 deployment/logs，Promtail 配置零改动）
      LOGGING_FILE_NAME: /var/log/payment-arch/mock-channel-web.log
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      PAYMENT_CHANNEL_SECRET: demo-channel-secret-2026
      MOCK_CHANNEL_SERVICES_MERCHANT: http://merchant-service:8081
      MOCK_CHANNEL_SERVICES_CATALOG: http://catalog-service:8082
      MOCK_CHANNEL_SERVICES_ORDER: http://order-service:8083
      MOCK_CHANNEL_SERVICES_PAYMENT: http://payment-service:8084
      MOCK_CHANNEL_SERVICES_REFUND: http://payment-service:8084
      MOCK_CHANNEL_SERVICES_FULFILLMENT: http://fulfillment-service:8086
      MOCK_CHANNEL_SERVICES_ENTITLEMENT: http://entitlement-service:8087
      MOCK_CHANNEL_SERVICES_RECON: http://reconciliation-service:8088
      MOCK_CHANNEL_SERVICES_SETTLEMENT: http://settlement-service:8089
      MOCK_CHANNEL_SERVICES_LEDGER: http://ledger-service:8090
    volumes:
      - ./logs:/var/log/payment-arch
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - pay-arch

networks:
  pay-arch:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  loki-data:
