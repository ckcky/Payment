    image: paymentarch/ledger-service:local
    container_name: payment-ledger-service
    profiles: ["full"]
    # 内存硬上限：Docker Desktop 默认配额 7.75GiB，10 个 JVM 必须各自受限，
    # 否则单一 JVM 失控会顶穿 VM 内存致全部容器 Exited(255)（2026-09-15 实测）。
    mem_limit: 512m
    ports:
      - "8090:8090"
    environment:
      # 容器日志落挂载卷（与宿主模式共用 deployment/logs，Promtail 配置零改动）
