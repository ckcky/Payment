# Commerce & Payment Platform MVP — 本地启动入口（双模式，spec 026 / ADR-0070）
#
# 两种运行模式，**端口互斥，二选一**（两种模式对外都暴露 8081–8091，同时跑会 bind 失败）：
#
#   ① 容器模式（本文件核心）：10 个应用 + 7 个中间件全部容器化
#        bash deployment/start-container.sh          # 推荐入口（含前置校验与模式守卫）
#        docker compose --profile full up -d         # 等价直接调用
#
#   ② 宿主模式（保留，ADR-0070 D2 双轨并存）：仅中间件容器化，应用以 ./mvnw 起宿主进程
#        bash deployment/start-all.sh                # 含模式守卫，检测到容器模式在跑会中止
#      本文件用 --profile infra 只起中间件，对应宿主模式所需依赖。
#
# 运行依赖：MySQL 8（业务库）+ Redis 7（下单入口幂等防重，ADR-0039/0040/0044）。
# Redis 为非数据源（fail-open），不可用时降级为不防重、记 order_idempotency_degraded_total。
#
# Database-per-Service：生产/集成测试每个服务独立数据库；本地单机开发为降低门槛，
# 用同一个 MySQL 实例承载多个逻辑库（每个服务一个 schema），仍保持服务间不共享表。
#
# initdb 目录仅含 01-create-databases.sql：首次 `up -d` 时只创建 8 个空数据库
# （对应 9 个服务，其中 merchant 无独立数据库），不创建任何业务表；表结构由后续
# 各服务自己的 migration 负责。完整业务表 DDL 参考见 schema/（不挂载、不自动执行）。
#
# 配置适配策略（ADR-0070 D4）：应用 `application.yml` 里硬编码的是 127.0.0.1，
# 容器内 127.0.0.1 指向容器自身。此处用 compose environment 覆盖为容器服务名，
# Spring Boot 环境变量优先级高于 yml，故**业务源码零变更**。

services:
  # ==========================================================================
  # 一、基础设施（两种模式共用）
  # ==========================================================================

  mysql:
    image: mysql:8.0
    container_name: payment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pay-arch

  # 可观测：Prometheus 抓取各服务 /actuator/prometheus；Grafana 呈现业务指标看板。
  # 容器模式下抓取目标是 compose 服务名（见 prometheus/prometheus.yml）；
  # 宿主模式下目标是 host.docker.internal（服务在宿主机）。
  redis:
    image: redis:7
    container_name: payment-redis
    # spec 029 / FR-501：Redis 由「纯缓存」升级为事务消息通道载体后，必须持久化与防驱逐——
    #   --appendonly yes：AOF 落盘，进程/容器重启后消息与消费位点不丢（L2 已诚实标注落盘窗口）
    #   --maxmemory 512mb + noeviction：容量触顶时**拒绝写入而非驱逐**，避免半消息/位点被
    #     无声淘汰导致消息凭空消失（INV-5：Redis 全丢时系统仍正确，但绝不能主动丢）
    #   数据卷 redis-data：容器重建后 AOF 与数据保留
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pay-arch

  # Redis 指标导出（spec 029 / FR-504）：「消息通道」面板的消费延迟与各组位点
  # 不在 JVM 侧（客户端拦截器无法感知服务端 PEL），必须由 redis_exporter 暴露
  #   redis_streams_pending_messages / redis_streams_entries_processed_total 等系列。
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: payment-redis-exporter
    environment:
      # 与 redis 服务同网络，直连容器名 + 默认端口
      REDIS_ADDR: "redis://redis:6379"
      # 只导出 stream 相关，减少基数（本大盘只用到 streams 系列）
      REDIS_EXPORTER_CHECK_STREAMS: "payment:*"
      REDIS_EXPORTER_CHECK_STREAM_GROUPS: "payment:*"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pay-arch

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: payment-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    extra_hosts:
      # 宿主模式下 Prometheus 抓取宿主进程需经此名访问宿主，两种模式都保留。
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - pay-arch

  grafana:
    image: grafana/grafana:11.3.0
    container_name: payment-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - pay-arch

  # 日志聚合（ADR-0059 后可观测性补全）：Promtail 采集日志推送 Loki，
  # Grafana 以 Loki 数据源在 Explore 中按 service/level 过滤查询。
  # **两种模式共用同一日志卷 ./logs**（容器模式应用日志写挂载卷，宿主模式由 start-all.sh 重定向），
  # 因此 promtail-config.yml 的采集路径无需随模式切换（ADR-0070 D5）。
  loki:
    image: grafana/loki:3.4.2
    container_name: payment-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - pay-arch

  promtail:
    image: grafana/promtail:3.4.2
    container_name: payment-promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/payment-arch:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - pay-arch

  # ADR-0059：Nacos 服务发现（注册中心）。单机/Compose 学习环境用 standalone 模式，关闭鉴权以降低本地摩擦。
  # 容器模式：各服务经内容器服务名 nacos:8848 注册，Feign 调用经服务发现解析（不再硬编码 url）。
  # 宿主模式：各服务经 127.0.0.1:8848 注册（9848/9849 gRPC 端口已映射到宿主）。
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: payment-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_SERVER_PORT: "8848"
      NACOS_AUTH_TOKEN: "UGF5bWVudEFyY2hOYWNvc1NlY3JldFRva2VuMjAyNkZpeGVkVmFsdWU5ODc2NTQzMjEw"
      NACOS_AUTH_IDENTITY_KEY: "nacos"
      NACOS_AUTH_IDENTITY_VALUE: "nacos"
    ports:
      # 8848：HTTP API / 控制台（宿主模式各服务的 nacos.discovery.server-addr 指向此端口）
      # 9848/9849：Nacos 2.x+ 客户端 gRPC 端口（主端口 +1000 / +1001）。宿主进程运行的
      #   微服务在 8848 完成注册协商后会改走 gRPC；缺这两个映射时客户端报
      #   "ErrCode:-401, ErrMsg:Client not connected, current status:STARTING"，服务启动失败。
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/ns/operator/metrics | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - pay-arch

  # ==========================================================================
  # 二、应用服务（仅容器模式，--profile full）
  #
  # 统一约定：
  #   - 端口对外映射与宿主模式**完全一致**（8081–8091），使 e2e / 压测 / demo 脚本零改动；
  #     8085 已随退款域并入 payment-service 退役（ADR-0064），不复用。
  #   - depends_on nacos 的 healthcheck：Nacos 是所有 @FeignClient 的硬依赖（ADR-0059），
  #     只依赖启动顺序会造成「服务起来了但跨服务调用全 Connection refused」的假成功。
  #   - environment 覆盖硬编码的 127.0.0.1（ADR-0070 D4），业务源码零变更。
  #   - 日志写挂载卷 ./logs，与 Promtail 采集路径对齐。
  # ==========================================================================

  merchant-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        JAR_FILE: deployment/output/jars/merchant-service-0.1.0-SNAPSHOT.jar
        SERVICE_PORT: 8081
    image: paymentarch/merchant-service:local
    container_name: payment-merchant-service
    profiles: ["full"]
    # 内存硬上限：Docker Desktop 默认配额 7.75GiB，10 个 JVM 必须各自受限，
    # 否则单一 JVM 失控会顶穿 VM 内存致全部容器 Exited(255)（2026-09-15 实测）。
    mem_limit: 512m
    ports:
      - "8081:8081"
    environment:
      # 容器日志落挂载卷（与宿主模式共用 deployment/logs，Promtail 配置零改动）
      LOGGING_FILE_NAME: /var/log/payment-arch/merchant-service.log
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    volumes:
      - ./logs:/var/log/payment-arch
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - pay-arch

  catalog-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        JAR_FILE: deployment/output/jars/catalog-service-0.1.0-SNAPSHOT.jar
        SERVICE_PORT: 8082
    image: paymentarch/catalog-service:local
    container_name: payment-catalog-service
    profiles: ["full"]
    # 内存硬上限：Docker Desktop 默认配额 7.75GiB，10 个 JVM 必须各自受限，
    # 否则单一 JVM 失控会顶穿 VM 内存致全部容器 Exited(255)（2026-09-15 实测）。
    # catalog 单独放宽到 768m：它承载「SKU 缓存读 + 秒杀 Lua」压测主流量，
    # 实测压测后瞬时 RSS 450MiB（512m 的 88%），余量不足有被 OOM-kill 的风险。
    mem_limit: 768m
    ports:
      - "8082:8082"
    environment:
      # 容器日志落挂载卷（与宿主模式共用 deployment/logs，Promtail 配置零改动）
      LOGGING_FILE_NAME: /var/log/payment-arch/catalog-service.log
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/catalog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    volumes:
      - ./logs:/var/log/payment-arch
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pay-arch

  order-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        JAR_FILE: deployment/output/jars/order-service-0.1.0-SNAPSHOT.jar
        SERVICE_PORT: 8083
    image: paymentarch/order-service:local
    container_name: payment-order-service
    profiles: ["full"]
    # 内存硬上限：Docker Desktop 默认配额 7.75GiB，10 个 JVM 必须各自受限，
    # 否则单一 JVM 失控会顶穿 VM 内存致全部容器 Exited(255)（2026-09-15 实测）。
    mem_limit: 512m
    ports:
      - "8083:8083"
    environment:
      # 容器日志落挂载卷（与宿主模式共用 deployment/logs，Promtail 配置零改动）
      LOGGING_FILE_NAME: /var/log/payment-arch/order-service.log
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    volumes:
      - ./logs:/var/log/payment-arch
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pay-arch

  payment-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        JAR_FILE: deployment/output/jars/payment-service-0.1.0-SNAPSHOT.jar
        SERVICE_PORT: 8084
    image: paymentarch/payment-service:local
    container_name: payment-payment-service
    profiles: ["full"]
    # 内存硬上限：Docker Desktop 默认配额 7.75GiB，10 个 JVM 必须各自受限，
    # 否则单一 JVM 失控会顶穿 VM 内存致全部容器 Exited(255)（2026-09-15 实测）。
    mem_limit: 512m
    ports:
      - "8084:8084"
    environment:
      # 容器日志落挂载卷（与宿主模式共用 deployment/logs，Promtail 配置零改动）
      LOGGING_FILE_NAME: /var/log/payment-arch/payment-service.log
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # 支付相关演示开关（取值与宿主模式 start-all.sh 对齐）：
      #   PAYMENT_MOCK_CASHIER_ENABLED=true  支付走「收银台跳转」路径（payUrl），演示优先
      #   PAYMENT_MOCK_CASHIER_BASE_URL      收银台地址——**必须填客户端（浏览器所在宿主）可达地址**！
      #       该值被拼进 payUrl 交给前端 window.open()，由**浏览器**解析，故口径是「宿主能否打开」。
      #       两种错误填法都实测过（2026-09-15）：
      #         ✗ http://mock-channel-web:8091 —— 容器内服务名，仅容器网络内可解析，宿主 NXDOMAIN
      #         ✗ http://host.docker.internal:8091 —— 该名仅**容器内**可解析，宿主同样 NXDOMAIN
      #       正解是 localhost:8091：8091 已 publish 到宿主，浏览器与宿主 curl 都能直达。
      #       （对比：prometheus.yml 用 host.docker.internal 是对的——那里是**容器主动出站抓取**，
      #        请求由 prometheus 容器发起；此处地址是给浏览器用的，方向相反，故取值不同。）
      #   PAYMENT_ADMIN_TOKEN                /payments/{id}/resolve 人工收敛端点的管理令牌（UNKNOWN 演示用）
      #   PAYMENT_CHANNEL_SECRET             与 mock-channel-web 同源签名密钥
      #   PAYMENT_CHANNEL_MOCK_SCENARIO     渠道模拟场景（SUCCESS / BUSINESS_UNKNOWN 等，ADR-0049 构造期注入），
      #                                      demo 的 UNKNOWN 权威收敛场景靠它切换（FR-009）。
      #                                      真实键为 payment.channel.mock-scenario（**注意在 channel 层**）。
      PAYMENT_MOCK_CASHIER_ENABLED: "true"
      PAYMENT_MOCK_CASHIER_BASE_URL: http://localhost:8091
      PAYMENT_ADMIN_TOKEN: demo-admin-token
      PAYMENT_CHANNEL_SECRET: demo-channel-secret-2026
      PAYMENT_CHANNEL_MOCK_SCENARIO: ${PAYMENT_CHANNEL_MOCK_SCENARIO:-SUCCESS}
      #   SPRING_PROFILES_ACTIVE=demo        激活演示专用 Bean（spec 028 / FR-035）：
      #       `POST /internal/channels/{code}/status` 渠道可用性开关 —— scenario-routing.sh
      #       的 S3/S4 靠它把渠道置 DOWN。**不激活该 profile 时端点不存在**（404/500），
      #       因为通道状态是纯内存覆盖、重启即回到配置值，只应存在于演示环境。
      SPRING_PROFILES_ACTIVE: demo
      #   Redis 连接（spec 027 用户支付限额，ADR-0071 D13）：payment-service 首次依赖 Redis，
      #       用途单一——预占额度的**惰性回收索引**（key `limit:pending:{paymentNo}`，EX=reserve-ttl）。
      #       取值与 order/catalog-service 对齐（同为容器网络内服务名）。
      #       运行期注意：Redis 不可用时限额域 fail-open（INV-9.2，不拦截支付），
      #       但 Actuator 的 redis 健康指示器为强依赖，会拖垮整体 /actuator/health（503/DOWN）。
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    volumes:
      - ./logs:/var/log/payment-arch
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pay-arch

  fulfillment-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        JAR_FILE: deployment/output/jars/fulfillment-service-0.1.0-SNAPSHOT.jar
        SERVICE_PORT: 8086
    image: paymentarch/fulfillment-service:local
    container_name: payment-fulfillment-service
    profiles: ["full"]
    # 内存硬上限：Docker Desktop 默认配额 7.75GiB，10 个 JVM 必须各自受限，
    # 否则单一 JVM 失控会顶穿 VM 内存致全部容器 Exited(255)（2026-09-15 实测）。
    mem_limit: 512m
    ports:
      - "8086:8086"
    environment:
      # 容器日志落挂载卷（与宿主模式共用 deployment/logs，Promtail 配置零改动）
      LOGGING_FILE_NAME: /var/log/payment-arch/fulfillment-service.log
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fulfillment?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # spec 029 / ADR-0074 D11：fulfillment 亦消费 MQ（FulfillmentMqConfig），
      # 必须指向 compose 网络内的 redis 服务名；缺此配置时回落 localhost 连不上，
      # 消费端静默不工作（2026-09-19 实测：漏配导致履约链路断）。
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    volumes:
      - ./logs:/var/log/payment-arch
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pay-arch

  entitlement-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        JAR_FILE: deployment/output/jars/entitlement-service-0.1.0-SNAPSHOT.jar
        SERVICE_PORT: 8087
    image: paymentarch/entitlement-service:local
    container_name: payment-entitlement-service
    profiles: ["full"]
    # 内存硬上限：Docker Desktop 默认配额 7.75GiB，10 个 JVM 必须各自受限，
    # 否则单一 JVM 失控会顶穿 VM 内存致全部容器 Exited(255)（2026-09-15 实测）。
    mem_limit: 512m
    ports:
      - "8087:8087"
    environment:
      # 容器日志落挂载卷（与宿主模式共用 deployment/logs，Promtail 配置零改动）
      LOGGING_FILE_NAME: /var/log/payment-arch/entitlement-service.log
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/entitlement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # spec 029 / ADR-0074 D11：entitlement 亦消费 MQ（EntitlementMqConfig），
      # 必须指向 compose 网络内的 redis 服务名；缺此配置时消费端静默不工作。
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    volumes:
      - ./logs:/var/log/payment-arch
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pay-arch

  reconciliation-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        JAR_FILE: deployment/output/jars/reconciliation-service-0.1.0-SNAPSHOT.jar
        SERVICE_PORT: 8088
    image: paymentarch/reconciliation-service:local
    container_name: payment-reconciliation-service
    profiles: ["full"]
    # 内存硬上限：Docker Desktop 默认配额 7.75GiB，10 个 JVM 必须各自受限，
    # 否则单一 JVM 失控会顶穿 VM 内存致全部容器 Exited(255)（2026-09-15 实测）。
    mem_limit: 512m
    ports:
      - "8088:8088"
    environment:
      # 容器日志落挂载卷（与宿主模式共用 deployment/logs，Promtail 配置零改动）
      LOGGING_FILE_NAME: /var/log/payment-arch/reconciliation-service.log
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/reconciliation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    volumes:
      - ./logs:/var/log/payment-arch
      # 渠道账单 CSV 注入目录（reconciliation.statement-dir-override，见 application.yml:56）。
      # e2e 的 ChannelStatementDiffE2ETest 由**测试 JVM（宿主）**写 /tmp/e2e-channel-statements，
      # 容器侧必须挂载同一路径才能读到——否则 4 个 CSV 差异用例全部「差异为空」而失败
      # （2026-09-15 实测：容器模式 23 测试中这 4 例必挂，宿主模式全过）。
      - /tmp/e2e-channel-statements:/tmp/e2e-channel-statements
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - pay-arch

  settlement-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
      args:
        JAR_FILE: deployment/output/jars/settlement-service-0.1.0-SNAPSHOT.jar
