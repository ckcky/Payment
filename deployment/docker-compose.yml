# Commerce & Payment Platform MVP — 单机启动入口
#
# 运行依赖：MySQL 8（业务库）+ Redis 7（下单入口幂等防重，ADR-0039/0040/0044）。
# Redis 为非数据源（fail-open），不可用时降级为不防重、记 order_idempotency_degraded_total。
# 各微服务镜像与编排在 Dockerfile 就绪后补齐；
# 当前本地运行以 `./mvnw` 直接启动各服务，服务端口（8081–8089）：
#   merchant 8081 / catalog 8082 / order 8083 / payment 8084 / refund 8085
#   fulfillment 8086 / entitlement 8087 / reconciliation 8088 / settlement 8089
#
# Database-per-Service：生产/集成测试每个服务独立数据库；本地单机开发为降低门槛，
# 用同一个 MySQL 实例承载多个逻辑库（每个服务一个 schema），仍保持服务间不共享表。
#
# initdb 目录仅含 01-create-databases.sql：首次 `up -d` 时只创建 8 个空数据库
# （对应 9 个服务，其中 merchant 无独立数据库），不创建任何业务表；表结构由后续
# 各服务自己的 migration 负责。完整业务表 DDL 参考见 schema/（不挂载、不自动执行）。

services:
  mysql:
    image: mysql:8.0
    container_name: payment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 可观测：Prometheus 抓取各服务 /actuator/prometheus；Grafana 呈现业务指标看板。
  # 服务以宿主进程运行（非容器），抓取目标用 host.docker.internal 访问宿主。
  redis:
    image: redis:7
    container_name: payment-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: payment-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: payment-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  # 日志聚合（ADR-0059 后可观测性补全）：Promtail 采集宿主 deployment/logs/*.log 推送 Loki，
  # Grafana 以 Loki 数据源在 Explore 中按 service/level 过滤查询。
  # 注意：服务以宿主进程运行，日志文件由 start-all.sh 重定向到 deployment/logs/。
  loki:
    image: grafana/loki:3.4.2
    container_name: payment-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.4.2
    container_name: payment-promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/payment-arch:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # ADR-0059：Nacos 服务发现（注册中心）。单机/Compose 学习环境用 standalone 模式，关闭鉴权以降低本地摩擦。
  # 各微服务启动后向 127.0.0.1:8848 注册，Feign 调用经服务发现解析服务名（不再硬编码 url）。
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: payment-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_SERVER_PORT: "8848"
      NACOS_AUTH_TOKEN: "UGF5bWVudEFyY2hOYWNvc1NlY3JldFRva2VuMjAyNkZpeGVkVmFsdWU5ODc2NTQzMjEw"
      NACOS_AUTH_IDENTITY_KEY: "nacos"
      NACOS_AUTH_IDENTITY_VALUE: "nacos"
    ports:
      # 8848：HTTP API / 控制台（宿主与各服务的 nacos.discovery.server-addr 指向此端口）
      # 9848/9849：Nacos 2.x+ 客户端 gRPC 端口（主端口 +1000 / +1001）。宿主进程运行的
      #   微服务在 8848 完成注册协商后会改走 gRPC；缺这两个映射时客户端报
      #   "ErrCode:-401, ErrMsg:Client not connected, current status:STARTING"，服务启动失败。
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/ns/operator/metrics | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  loki-data:
