# E2E local 环境（spec 022 / FR-001）：复用本地已起栈——10 个服务 + docker-compose MySQL。
# 服务基址（黑盒 HTTP，Env.serviceUrl）
service.order=http://localhost:8083
service.payment=http://localhost:8084
service.fulfillment=http://localhost:8086
service.entitlement=http://localhost:8087
service.reconciliation=http://localhost:8088
service.settlement=http://localhost:8089
service.ledger=http://localhost:8090
service.catalog=http://localhost:8082
service.merchant=http://localhost:8081
service.mock=http://localhost:8091
# 多 schema JDBC（本机 docker-compose MySQL，root 仅测试环境使用）
db.order=jdbc:mysql://localhost:3306/order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.payment=jdbc:mysql://localhost:3306/payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.fulfillment=jdbc:mysql://localhost:3306/fulfillment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.entitlement=jdbc:mysql://localhost:3306/entitlement?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.ledger=jdbc:mysql://localhost:3306/ledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.settlement=jdbc:mysql://localhost:3306/settlement?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.reconciliation=jdbc:mysql://localhost:3306/reconciliation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.catalog=jdbc:mysql://localhost:3306/catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.merchant=jdbc:mysql://localhost:3306/merchant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
db.user=root
db.password=root
# 轮询收敛预算（NFR-004）
e2e.await.timeout-ms=20000
# 秒杀 SKU（可选：unset 时 SeckillRestockE2ETest 按 Assumptions 跳过）
# e2e.seckill.sku-id=9001
