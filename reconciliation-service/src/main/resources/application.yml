spring:
  application:
    name: reconciliation-service
  datasource:
    url: jdbc:mysql://localhost:3306/reconciliation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    openfeign:
      client:
        config:
          default:
            # 出站 RPC 超时：connect/read 各 1s（ADR-0012 超时口径，全服务统一）
            connect-timeout: 1000
            read-timeout: 1000

server:
  port: 8088

# 平台级安全底座（Feature 009 / ADR-0034）：出站内部服务令牌
# 开关打开且注入 PLATFORM_INTERNAL_TOKEN 后，出站 RPC 才会对 /internal/** 端点附加 X-Service-Token。
platform:
  security:
    internal-token: ${PLATFORM_INTERNAL_TOKEN:}
    outbound-token-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

services:
  payment:
    url: http://localhost:8084
  refund:
    url: http://localhost:8085

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
