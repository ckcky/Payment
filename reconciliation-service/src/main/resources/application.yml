spring:
  application:
    name: reconciliation-service
  datasource:
    url: jdbc:mysql://localhost:3306/reconciliation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
    openfeign:
      client:
        config:
          default:
            # 出站 RPC 超时：connect/read 各 1s（ADR-0012 超时口径，全服务统一）
            connect-timeout: ${PAYMENT_FEIGN_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${PAYMENT_FEIGN_READ_TIMEOUT_MS:1000}

  lifecycle:
    # 优雅停机排水上限：SIGTERM 后在途请求最多等 30s（spec 023 / M5）
    timeout-per-shutdown-phase: 30s

server:
  port: 8088
  # 优雅停机：等在途请求完成再关闭（spec 023 / M5）
  shutdown: graceful

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # P99 面板依赖 http_server_requests_seconds_bucket
        http.client.requests: true  # RPC 面板依赖 http_client_requests_seconds_bucket（Feign）
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

reconciliation:
  # 渠道账单 fixture 目录（demo 场景经 POST /internal/reconciliation/statement-imports 导入其内容）。
  # 032 实账化（ADR-0080）：sample.csv 回退与 statement-dir-override 目录注入已删除，
  # 账单唯一入口 = 导入接口（内容 SHA-256 幂等）；无可用 NORMALIZED 导入 ⇒ 400 STATEMENT_UNAVAILABLE。
  statement-dir: fixtures/channel-statements

# 事实读取 RPC（payment / refund facts）显式超时（spec 006 T035 / ADR-0021）：
# 由 FactsClientConfig 局部绑定到两个 facts 客户端，不影响其他 Feign 客户端。
services:
  payment:
    connect-timeout-ms: ${PAYMENT_FACTS_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${PAYMENT_FACTS_READ_TIMEOUT_MS:3000}
