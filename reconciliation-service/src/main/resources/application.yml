spring:
  application:
    name: reconciliation-service
  datasource:
    url: jdbc:mysql://localhost:3306/reconciliation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
    openfeign:
      client:
        config:
          default:
            # 出站 RPC 超时：connect/read 各 1s（ADR-0012 超时口径，全服务统一）
            connect-timeout: 1000
            read-timeout: 1000

  lifecycle:
    # 优雅停机排水上限：SIGTERM 后在途请求最多等 30s（spec 023 / M5）
    timeout-per-shutdown-phase: 30s

server:
  port: 8088
  # 优雅停机：等在途请求完成再关闭（spec 023 / M5）
  shutdown: graceful

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # P99 面板依赖 http_server_requests_seconds_bucket
        http.client.requests: true  # RPC 面板依赖 http_client_requests_seconds_bucket（Feign）
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

reconciliation:
  statement-dir: fixtures/channel-statements
  # 周期 fixture 未命中时的回退默认账单（spec 006 T018）
  statement:
    default-file: sample.csv
  # E2E 差异注入覆盖目录（spec 022 / T421）：存在 {dir}/{period}.csv 时优先于 classpath fixture。
  # 目录缺省不存在 → 行为零变化；E2E 运行时向此目录落盘 {period}.csv 注入账实差异。
  statement-dir-override: /tmp/e2e-channel-statements

# 事实读取 RPC（payment / refund facts）显式超时（spec 006 T035 / ADR-0021）：
# 由 FactsClientConfig 局部绑定到两个 facts 客户端，不影响其他 Feign 客户端。
services:
  payment:
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
