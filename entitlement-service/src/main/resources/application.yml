spring:
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
  application:
    name: entitlement-service
  data:
    redis:
      host: localhost
      port: 6379
      # spec 029 / FR-305：Redis 作事务消息通道载体（非数据源，INV-5）。
      # 通道不可用时回落同步 Feign（mq.enabled=false）。
      # ⚠️ 必须 > payment.mq.block-ms(默认 2000ms)：阻塞读超时会致消费端空转不消费。
      timeout: 5000ms
      lettuce:
        pool:
          # 消费端 XREADGROUP 为短阻塞读（blockMs=2000），连接池避免与生产者争抢单连接
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
  datasource:
    url: jdbc:mysql://localhost:3306/entitlement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  lifecycle:
    # 优雅停机排水上限：SIGTERM 后在途请求最多等 30s（spec 023 / M5）
    timeout-per-shutdown-phase: 30s

server:
  port: 8087
  # 优雅停机：等在途请求完成再关闭（spec 023 / M5）
  shutdown: graceful

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # P99 面板依赖 http_server_requests_seconds_bucket
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# spec 034 T21：MQ 消费方的死信管理端点 /internal/mq/dlq（读/回放/清空）。
# 启用但未配置 admin-token 时端点 503 锁死（同 payment resolve 先例：显式失败优于裸奔）。
payment:
  mq:
    dlq-admin:
      enabled: true
      admin-token: ${MQ_DLQ_ADMIN_TOKEN:}
