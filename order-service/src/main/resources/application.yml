spring:
  application:
    name: order-service
  data:
    redis:
      host: localhost
      port: 6379
      # Redis 用作下单入口幂等防重（非数据源，fail-open）。连接失败不阻断下单。
      timeout: 1000ms
      lettuce:
        # 连接池（ADR-0060）：幂等键读写高并发下避免单连接排队。需 commons-pool2 依赖。
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
  datasource:
    url: jdbc:mysql://localhost:3306/order?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
    openfeign:
      client:
        config:
          default:
            # 出站 RPC 超时：connect/read 各 1s（ADR-0012 超时口径，全服务统一）
            connect-timeout: 1000
            read-timeout: 1000

  lifecycle:
    # 优雅停机排水上限：SIGTERM 后在途请求最多等 30s（spec 023 / M5）
    timeout-per-shutdown-phase: 30s

server:
  port: 8083
  # 优雅停机：等在途请求完成再关闭（spec 023 / M5）
  shutdown: graceful

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true  # P99 面板依赖 http_server_requests_seconds_bucket
        http.client.requests: true  # RPC 面板依赖 http_client_requests_seconds_bucket（Feign）
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 订单超时（014）：Redis ZSet 时间轮。下单进入待支付后登记，到期未支付则取消并释放库存。
order:
  timeout:
    enabled: true
    ttl-seconds: 900
    poll-millis: 5000
    zset-key: order:timeouts
  ratelimit:
    enabled: true
    capacity: 50
    window-millis: 1000
    bucket: /orders
