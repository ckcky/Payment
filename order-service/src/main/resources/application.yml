spring:
  application:
    name: order-service
  data:
    redis:
      host: localhost
      port: 6379
      # Redis 用作下单入口幂等防重（非数据源，fail-open）。连接失败不阻断下单。
      timeout: 1000ms
  datasource:
    url: jdbc:mysql://localhost:3306/order?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
    openfeign:
      client:
        config:
          default:
            # 出站 RPC 超时：connect/read 各 1s（ADR-0012 超时口径，全服务统一）
            connect-timeout: 1000
            read-timeout: 1000

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 订单超时（014）：Redis ZSet 时间轮。下单进入待支付后登记，到期未支付则取消并释放库存。
order:
  timeout:
    enabled: true
    ttl-seconds: 900
    poll-millis: 5000
    zset-key: order:timeouts
  ratelimit:
    enabled: true
    capacity: 50
    window-millis: 1000
    bucket: /orders
